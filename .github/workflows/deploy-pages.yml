name: Build and Deploy SlipSense Production Bundle to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Minified & Obfuscated Production Artifact (dist/)
        run: node scripts/build_prod.js

      - name: Run Automated Security, IP & Functional Test Suite
        run: node scripts/run_tests.js

      - name: Verify Zero Source Code, Source Maps, or Secrets in dist/
        run: |
          if find dist -type f \( -name "*.ts" -o -name "*.map" -o -name "*.sql" -o -name "*.env*" \) | grep -q .; then
            echo "ERROR: Forbidden source or map file detected in dist/"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ONLY dist/ Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
